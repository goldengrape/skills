[project]
name = "delegate-to-chatgpt-web"
version = "0.1.0"
description = "Development and verification project for the delegate-to-chatgpt-web Codex skill."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: uses the signed-in ChatGPT Web session and requires explicit user authorization",
]

[tool.ruff]
line-length = 100
target-version = "py311"
